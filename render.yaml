services:
  - type: web
    name: vedicyog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # set in the Render dashboard; never commit it
      - key: SECRET_KEY
        generateValue: true # signs login cookies
      - key: DATABASE_URL
        sync: false # Postgres connection string (e.g. a free Neon database); keeps accounts across deploys
      - key: MAX_QUESTIONS
        value: "5"
